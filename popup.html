<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 14px 16px 16px; width: 280px; color: #0f172a; }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .head img { width: 32px; height: 32px; }
  h1 { font-size: 16px; margin: 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 10px; background: #f1f5f9; }
  .row span { font-weight: 600; }
  .switch { position: relative; width: 44px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 24px; cursor: pointer; transition: background .2s; }
  .slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
  .switch input:checked + .slider { background: #1e6fd9; }
  .switch input:checked + .slider::before { transform: translateX(20px); }
  .switch input:focus-visible + .slider { outline: 2px solid #1e6fd9; outline-offset: 2px; }
  p { color: #475569; margin: 12px 0; }
  .foot { display: flex; align-items: center; justify-content: space-between; }
  button { font: inherit; padding: 5px 10px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; cursor: pointer; }
  #stats { color: #64748b; font-size: 12px; }
</style>
</head>
<body>
  <div class="head"><img src="icons/icon48.png" alt=""><h1>BezOwijania</h1></div>
  <label class="row">
    <span id="label">Prawdziwe tytuły</span>
    <span class="switch"><input type="checkbox" id="enabled" role="switch"><span class="slider"></span></span>
  </label>
  <p>Interia, WP i Onet. Tytuł zastępowany jest streszczeniem, które redakcja sama umieszcza w artykule. Najedź na tytuł, żeby zobaczyć oryginał. <span style="color:#f59e0b">●</span> = prawdopodobnie reklama.</p>
  <div class="foot">
    <span id="stats"></span>
    <button id="clear">Wyczyść pamięć</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
